databases:
  - name: campusfix-db
    databaseName: campusfix
    user: campusfix
    plan: free

services:
  - type: web
    name: campusfix-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString
