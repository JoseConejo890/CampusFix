name: campusfix

services:
  web:
    image: node:22-alpine
    working_dir: /workspace/apps/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      NODE_ENV: development
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NUXT_PUBLIC_API_BASE: http://localhost:4000/api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      - api

  api:
    # The API container is an environment placeholder until its app entrypoint is added.
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://campusfix:campusfix_dev@db:5432/campusfix_dev
    ports:
      - "4000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusfix_dev
      POSTGRES_USER: campusfix
      POSTGRES_PASSWORD: campusfix_dev
    ports:
      - "5432:5432"
    volumes:
      - campusfix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfix -d campusfix_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  web_node_modules:
  campusfix_postgres_data:
